server {
    listen 80;
    server_name _;

    # Serve the React build (static files)
    # TRADEOFF vs ECS/S3+CloudFront:
    # Pro: Zero extra AWS services. Same machine, zero latency to backend.
    # Con: Every frontend redeploy requires SSH + rebuild. No CDN edge caching.
    root /opt/sahayak/frontend/dist;
    index index.html;

    # React SPA: unknown routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + health requests to FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # WebSocket proxy — the critical part.
    # TRADEOFF vs ECS+ALB: Nginx needs these upgrade headers explicitly.
    # ALB handles WebSocket upgrade automatically. Here we do it manually.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;  # Keep WS alive for up to 24h
    }
}
